name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU, no torch)
        run: uv sync
      - name: Doctor
        run: uv run vreg doctor || true
      - name: Tests
        run: uv run pytest -q -m "not gpu"
