[project]
name = "vreg"
version = "0.1.0"
description = "Closed-loop black-box pre-compensation for platform video compression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "optuna>=4.0",
    "cmaes>=0.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# GPU / learned components: LPIPS metric, differentiable surrogate pipeline
torch = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lpips>=0.1.4",
]

[project.scripts]
vreg = "vreg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vreg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs torch (and ideally CUDA)",
    "slow: takes more than a few seconds",
]
